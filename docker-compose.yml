services:
  postgres:
    image: postgres:17
    container_name: rental-platform-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: rental_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - rental_platform_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d rental_platform']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  rental_platform_postgres_data:
